name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Check site size against the budget
        run: |
          budget_mb=200
          size_mb=$(du -sm dist | cut -f1)
          echo "dist/ is ${size_mb} MB (budget ${budget_mb} MB)"
          if [ "$size_mb" -gt "$budget_mb" ]; then
            echo "::error::dist/ is ${size_mb} MB, over the ${budget_mb} MB budget. See docs/PUBLISHING.md."
            exit 1
          fi

  validate-events:
    name: Validate events
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run validate:events

  validate-library:
    name: Validate library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run validate:library
